{% extends 'layout.html' %}
{% block title %}Chart{% endblock %}

{% block main %}
<div style="width: 80%; margin: auto;">
    <canvas id="chartCanvas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    function taylorSeriesSin(x, n) {
        let sum = 0;
        for (let k = 0; k < n; k++) {
            sum += Math.pow(-1, k) * Math.pow(x, 2 * k + 1) / factorial(2 * k + 1);
        }
        return sum;
    }

    function factorial(num) {
        if (num === 0 || num === 1) return 1;
        let result = 1;
        for (let i = 2; i <= num; i++) {
            result *= i;
        }
        return result;
    }

    const xValues = [];
    const taylorValues = [];
    const mathValues = [];
    const n = 5;

    for (let x = -Math.PI; x <= Math.PI; x += 0.1) {
        xValues.push(x.toFixed(2));
        taylorValues.push(taylorSeriesSin(x, n));
        mathValues.push(Math.sin(x));
    }

    // Построение графика
    const ctx = document.getElementById('chartCanvas').getContext('2d');
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: xValues,
            datasets: [
                {
                    label: `Taylor Series (n=${n})`,
                    data: taylorValues,
                    borderColor: 'rgba(255, 99, 132, 1)',
                    borderWidth: 2,
                    fill: false,
                },
                {
                    label: 'Math.sin(x)',
                    data: mathValues,
                    borderColor: 'rgba(54, 162, 235, 1)',
                    borderWidth: 2,
                    fill: false,
                }
            ]
        },
        options: {
            responsive: true,
            animation: {
                duration: 1000,
                easing: 'easeInOutQuad'
            },
            plugins: {
                legend: {
                    position: 'top',
                },
                title: {
                    display: true,
                    text: 'Сравнение разложения в ряд Тейлора и точного значения sin(x)'
                },
                tooltip: {
                    callbacks: {
                        label: function (tooltipItem) {
                            return `y = ${tooltipItem.raw}`;
                        }
                    }
                }
            },
            scales: {
                x: {
                    title: {
                        display: true,
                        text: 'Аргумент (x)',
                    }
                },
                y: {
                    title: {
                        display: true,
                        text: 'Значение функции (F(x))',
                    }
                }
            }
        }
    });
</script>
{% endblock %}
